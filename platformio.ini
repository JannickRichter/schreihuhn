[platformio]
default_envs = stopwatch

[env:stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DESP32S3
    -DBOARD_ID=30
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Ilib/schreihuhn_core/include
lib_deps =
    m5stack/M5Unified @ =0.3.0
    m5stack/M5GFX @ =0.3.0
    https://github.com/m5stack/M5PM1.git#1.0.7
    https://github.com/m5stack/M5IOE1.git#1.0.9
test_ignore = *

[env:stopwatch_debug]
extends = env:stopwatch
build_flags =
    ${env:stopwatch.build_flags}
    -DDEBUG_LOG
    -DSIM_INPUT

[env:stopwatch_reset]
extends = env:stopwatch
build_flags =
    ${env:stopwatch.build_flags}
    -DRESET_SAVE

[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror=return-type
    -Ilib/schreihuhn_core/include
    -Itest/mocks
lib_deps =
    throwtheswitch/Unity @ =2.6.1
build_src_filter = -<*>
